<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Hocine, ingénieur DevOps et Platform Engineering">
  <style>
    .t{font-family:'Segoe UI',Helvetica,Arial,sans-serif;fill:#1f2328}
    .m{font-family:'Segoe UI',Helvetica,Arial,sans-serif;fill:#59636e}
    .n{font-family:'Segoe UI',Helvetica,Arial,sans-serif;fill:#1f2328;font-size:15px;font-weight:600}
    .flow{stroke:#1a7f37;stroke-width:2;fill:none;stroke-dasharray:6 6;animation:d 1.2s linear infinite}
    @keyframes d{to{stroke-dashoffset:-12}}
    .dot{fill:#1a7f37;animation:p 2.4s ease-in-out infinite}
    @keyframes p{0%,100%{opacity:.35}50%{opacity:1}}
  </style>
  <defs><clipPath id="c"><rect width="1200" height="300" rx="14"/></clipPath></defs>
  <g clip-path="url(#c)">
  <rect width="1200" height="300" rx="14" fill="#ffffff"/>
  <rect x="0" y="0" width="6" height="300" fill="#1a7f37"/>
  </g>
  <text x="56" y="112" class="t" font-size="46" font-weight="700">Hocine</text>
  <text x="56" y="152" class="t" font-size="22" font-weight="500">Ingénieur DevOps · Platform Engineering</text>
  <text x="56" y="190" class="m" font-size="16">Kubernetes · GitOps · Infrastructure as Code · Lyon</text>
  <circle cx="62" cy="236" r="5" class="dot"/>
  <text x="76" y="241" class="m" font-size="15">En construction : une Internal Developer Platform, de l'hyperviseur au portail</text>

  <g transform="translate(640,70)">
    <text x="0" y="0" class="m" font-size="13" letter-spacing="2">DE GIT À LA PRODUCTION</text>
    <g transform="translate(0,22)">
      <rect x="0"   y="0" width="96" height="44" rx="8" fill="#f6f8fa" stroke="#d1d9e0"/>
      <text x="48"  y="27" class="n" text-anchor="middle">Git</text>
      <rect x="136" y="0" width="96" height="44" rx="8" fill="#f6f8fa" stroke="#d1d9e0"/>
      <text x="184" y="27" class="n" text-anchor="middle">CI</text>
      <rect x="272" y="0" width="96" height="44" rx="8" fill="#f6f8fa" stroke="#d1d9e0"/>
      <text x="320" y="27" class="n" text-anchor="middle">Harbor</text>
      <rect x="408" y="0" width="112" height="44" rx="8" fill="#f6f8fa" stroke="#d1d9e0"/>
      <text x="464" y="27" class="n" text-anchor="middle">ArgoCD</text>
      <path class="flow" d="M96 22H136M232 22H272M368 22H408"/>
    </g>
    <g transform="translate(0,96)">
      <rect x="0" y="0" width="520" height="92" rx="10" fill="none" stroke="#d1d9e0" stroke-dasharray="4 4"/>
      <text x="16" y="24" class="m" font-size="12" letter-spacing="1.5">KUBERNETES · CILIUM · VAULT · OBSERVABILITÉ</text>
      <rect x="16"  y="38" width="112" height="38" rx="7" fill="#f6f8fa" stroke="#d1d9e0"/>
      <text x="72"  y="62" class="n" text-anchor="middle" font-size="14">Applications</text>
      <rect x="140" y="38" width="112" height="38" rx="7" fill="#f6f8fa" stroke="#d1d9e0"/>
      <text x="196" y="62" class="n" text-anchor="middle" font-size="14">Secrets</text>
      <rect x="264" y="38" width="112" height="38" rx="7" fill="#f6f8fa" stroke="#d1d9e0"/>
      <text x="320" y="62" class="n" text-anchor="middle" font-size="14">Métriques</text>
      <rect x="388" y="38" width="116" height="38" rx="7" fill="#f6f8fa" stroke="#d1d9e0"/>
      <text x="446" y="62" class="n" text-anchor="middle" font-size="14">Backstage</text>
    </g>
    <path class="flow" d="M464 66V96"/>
  </g>
</svg>
